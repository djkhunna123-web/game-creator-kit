<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0820">
  <!-- ติดตั้งเป็นแอปบนมือถือ (PWA): ไอคอนบนหน้าจอ เปิดเต็มจอ -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>เกมของฉัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@500;700&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05040f; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; }
    #game { position: absolute; inset: 0; }

    /* หน้าใส่ชื่อหลังจบเกม (Step 3) */
    #sheet { position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
      padding: 16px; background: rgba(5, 4, 15, .72); font-family: 'IBM Plex Sans Thai Looped', Tahoma, sans-serif; }
    #sheet[hidden] { display: none; }
    #sheetForm { width: 100%; max-width: 320px; box-sizing: border-box; padding: 24px 20px 18px; border-radius: 20px;
      background: #1a1440; border: 2px solid #ffe082; color: #fff; text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
    #sheetForm .t { margin: 0; font-size: 18px; font-weight: 700; color: #c5cae9; }
    #sheetScore { margin: 2px 0 14px; font-size: 44px; font-weight: 700; color: #ffe082; line-height: 1.2; }
    #sheetForm label { display: block; margin-bottom: 6px; font-size: 16px; font-weight: 700; }
    #sheetName { width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 12px; border: 2px solid #7c6cf0;
      background: #0b0820; color: #fff; font: 700 20px 'IBM Plex Sans Thai Looped', Tahoma, sans-serif; text-align: center;
      -webkit-user-select: text; user-select: text; touch-action: manipulation; }
    #sheetName:focus { outline: none; border-color: #ffe082; }
    #sheetForm button { width: 100%; margin-top: 12px; padding: 13px; border-radius: 14px; border: 0; cursor: pointer;
      font: 700 20px 'IBM Plex Sans Thai Looped', Tahoma, sans-serif; touch-action: manipulation; }
    #sheetSend { background: #ff4081; color: #fff; }
    #sheetSend:disabled { opacity: .6; }
    #sheetSkip { background: transparent; color: #c5cae9; font-size: 17px !important; margin-top: 4px !important; }
    #sheetMsg { min-height: 1.4em; margin: 6px 0 0; font-size: 15px; font-weight: 500; color: #ff8a80; }

  </style>
</head>
<body>
  <div id="game"></div>

  <div id="sheet" hidden>
    <form id="sheetForm" autocomplete="off">
      <p class="t">คะแนนของคุณ</p>
      <div id="sheetScore"></div>
      <label for="sheetName">ชื่อบนจอใหญ่</label>
      <input id="sheetName" maxlength="12" enterkeyhint="send" placeholder="พิมพ์ชื่อเล่น" spellcheck="false">
      <button type="submit" id="sheetSend">ส่งขึ้นจอใหญ่</button>
      <button type="button" id="sheetSkip">ข้าม</button>
      <p id="sheetMsg" role="status"></p>
    </form>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
  <script src="config.js"></script>
  <script src="juice.js"></script>
  <script src="online.js"></script>
  <script src="game.js"></script>
  <script>
    document.title = CONFIG.TITLE || document.title;
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
